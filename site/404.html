<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – Prasanth S</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; --paper:#F3F6F8; --ink:#12202A; --slate:#4B5D6B; --harbor:#12577A; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --paper:#0E1B24; --ink:#E6EEF3; --slate:#9DB0BE; --harbor:#6CB8DE; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink);
           font-family:"IBM Plex Sans","Segoe UI",Arial,sans-serif; padding:24px; }
    h1 { font-family:"Arial Narrow",Arial,sans-serif; font-size:56px; margin:0 0 8px; }
    p { color:var(--slate); margin:0 0 24px; }
    a { color:var(--harbor); font-weight:600; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist. The address may be mistyped or the page has moved.</p>
    <a href="/">Go to the home page</a>
  </main>
</body>
</html>
